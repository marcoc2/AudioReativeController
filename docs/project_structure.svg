<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="folderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fileGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64748b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a" rx="12" />

  <!-- Title -->
  <text x="40" y="50" font-family="Inter, sans-serif" font-size="24" font-weight="bold" fill="#f8fafc">AudioReactiveController Structure</text>
  <line x1="40" y1="65" x2="350" y2="65" stroke="#334155" stroke-width="2" />

  <!-- Tree Structure -->
  <g transform="translate(40, 100)" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">
    
    <!-- Root -->
    <rect x="0" y="0" width="220" height="30" rx="6" fill="url(#folderGradient)" filter="url(#glow)" />
    <text x="35" y="20" fill="white" font-weight="600">AudioReactiveController/</text>
    <path d="M10 8 L22 8 L24 12 L28 12 L28 22 L10 22 Z" fill="white" opacity="0.8" />

    <!-- Core -->
    <line x1="15" y1="30" x2="15" y2="380" stroke="#334155" stroke-width="2" />
    <line x1="15" y1="60" x2="40" y2="60" stroke="#334155" stroke-width="2" />
    <rect x="45" y="45" width="180" height="30" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <text x="75" y="65">core/</text>
    <path d="M55 53 L67 53 L69 57 L73 57 L73 67 L55 67 Z" fill="#3b82f6" />

    <!-- Core Sub -->
    <line x1="60" y1="75" x2="60" y2="180" stroke="#334155" stroke-width="2" />
    
    <!-- core/rhythm -->
    <line x1="60" y1="100" x2="85" y2="100" stroke="#334155" stroke-width="2" />
    <rect x="90" y="85" width="150" height="26" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <text x="115" y="103" font-size="12">rhythm/</text>
    
    <line x1="105" y1="111" x2="105" y2="175" stroke="#334155" stroke-width="1" />
    <text x="125" y="125" font-size="11" opacity="0.8">analyzer.py</text>
    <text x="125" y="145" font-size="11" opacity="0.8">grid.py</text>
    <text x="125" y="165" font-size="11" opacity="0.8">midi_reader.py</text>

    <!-- core files -->
    <line x1="60" y1="195" x2="85" y2="195" stroke="#334155" stroke-width="2" />
    <text x="90" y="200" font-size="12">feature_extractor.py</text>
    
    <line x1="60" y1="215" x2="85" y2="215" stroke="#334155" stroke-width="2" />
    <text x="90" y="220" font-size="12">motion.py</text>

    <line x1="60" y1="235" x2="85" y2="235" stroke="#334155" stroke-width="2" />
    <text x="90" y="240" font-size="12">stem_service.py</text>

    <!-- Visualizer -->
    <line x1="15" y1="270" x2="40" y2="270" stroke="#334155" stroke-width="2" />
    <rect x="45" y="255" width="180" height="30" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <text x="75" y="275">visualizer/</text>

    <line x1="60" y1="285" x2="60" y2="320" stroke="#334155" stroke-width="2" />
    <text x="75" y="305" font-size="12">visualizer_debug.py</text>
    <text x="75" y="325" font-size="12">visualizer_pygame.py</text>

    <!-- Tests -->
    <line x1="15" y1="355" x2="40" y2="355" stroke="#334155" stroke-width="2" />
    <rect x="45" y="340" width="180" height="30" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <text x="75" y="360">tests/</text>

    <!-- Root Files -->
    <g transform="translate(400, 0)">
      <text x="0" y="20" font-weight="bold" fill="#60a5fa">Entry Points &amp; Docs</text>
      <rect x="0" y="40" width="220" height="30" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1" />
      <text x="15" y="60">animation_generator.py</text>
      
      <rect x="0" y="80" width="220" height="30" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1" />
      <text x="15" y="100">README.md</text>
      
      <rect x="0" y="120" width="220" height="30" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1" />
      <text x="15" y="140">requirements.txt</text>

      <rect x="0" y="160" width="220" height="30" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1" />
      <text x="15" y="180">ARC_Backlog.md</text>

      <rect x="0" y="200" width="220" height="30" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1" />
      <text x="15" y="220">ARC_Implementation_Plan.md</text>
    </g>

  </g>

  <!-- Footer Decor -->
  <rect x="40" y="550" width="720" height="4" rx="2" fill="#1e293b" />
  <rect x="40" y="550" width="120" height="4" rx="2" fill="#3b82f6" />
</svg>
