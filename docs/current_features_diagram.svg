<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bgGradient)" rx="15" />

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#e94560" font-family="Arial, sans-serif" font-size="24" font-weight="bold">ARC: AudioFeatureExtractor Data Flow</text>

  <!-- Class Box -->
  <rect x="50" y="80" width="220" height="400" fill="#0f3460" stroke="#e94560" stroke-width="2" rx="10" />
  <text x="160" y="110" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">AudioFeatureExtractor</text>
  <line x1="60" y1="120" x2="260" y2="120" stroke="#e94560" stroke-width="1" />
  
  <!-- Class State -->
  <text x="70" y="145" fill="#a2a8d3" font-family="monospace" font-size="12">self.spectrogram [M]</text>
  <text x="70" y="165" fill="#a2a8d3" font-family="monospace" font-size="12">self.stems_energy [D]</text>
  <text x="70" y="185" fill="#a2a8d3" font-family="monospace" font-size="12">self.centroid [A]</text>
  <text x="70" y="205" fill="#a2a8d3" font-family="monospace" font-size="12">self.chroma [A]</text>
  <text x="70" y="225" fill="#a2a8d3" font-family="monospace" font-size="12">self.prev_features [D]</text>

  <!-- Method Arrow -->
  <path d="M 270 280 L 350 280" stroke="#fff" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fff" />
    </marker>
  </defs>
  <text x="310" y="270" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-style="italic">get_features_at_time(t)</text>

  <!-- Functionality Logic -->
  <rect x="360" y="200" width="120" height="160" fill="#16213e" stroke="#00d2ff" stroke-width="2" rx="5" />
  <text x="420" y="230" text-anchor="middle" fill="#00d2ff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">LOGIC</text>
  <text x="370" y="260" fill="#fff" font-family="Arial, sans-serif" font-size="11">1. Search Index (t)</text>
  <text x="370" y="285" fill="#fff" font-family="Arial, sans-serif" font-size="11">2. Extract Slices</text>
  <text x="370" y="310" fill="#fff" font-family="Arial, sans-serif" font-size="11">3. Normalization</text>
  <text x="370" y="335" fill="#fff" font-family="Arial, sans-serif" font-size="11">4. Smoothing</text>

  <!-- Arrow to Result -->
  <path d="M 480 280 L 530 280" stroke="#fff" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />

  <!-- current_features Box -->
  <rect x="540" y="100" width="220" height="420" fill="#0f3460" stroke="#00d2ff" stroke-width="2" rx="10" filter="url(#glow)" />
  <text x="650" y="130" text-anchor="middle" fill="#00d2ff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">current_features {dict}</text>
  <line x1="550" y1="140" x2="750" y2="140" stroke="#00d2ff" stroke-width="1" />

  <!-- Dictionary Contents -->
  <text x="560" y="170" fill="#fff" font-family="monospace" font-size="12">"spectrum": np.array</text>
  <text x="560" y="190" fill="#fff" font-family="monospace" font-size="12">"bands": np.array</text>
  <text x="560" y="210" fill="#fff" font-family="monospace" font-size="12">"stems": dict</text>
  <text x="560" y="230" fill="#fff" font-family="monospace" font-size="12">"vocal": float</text>
  <text x="560" y="255" fill="#a2a8d3" font-family="monospace" font-size="11"># Added Extras:</text>
  <text x="560" y="275" fill="#fff" font-family="monospace" font-size="12">"centroid": float</text>
  <text x="560" y="295" fill="#fff" font-family="monospace" font-size="12">"chroma": np.array</text>
  <text x="560" y="315" fill="#fff" font-family="monospace" font-size="12">"dominant_pitch": int</text>
  <text x="560" y="335" fill="#fff" font-family="monospace" font-size="12">"flux": float</text>
  <text x="560" y="355" fill="#fff" font-family="monospace" font-size="12">"onset": bool</text>
  <text x="560" y="375" fill="#fff" font-family="monospace" font-size="12">"subbands": dict</text>
  
  <text x="560" y="410" fill="#e94560" font-family="monospace" font-size="11"># After Smoothing:</text>
  <text x="560" y="430" fill="#e94560" font-family="monospace" font-size="12">"bass", "mid", "high"</text>
  <text x="560" y="450" fill="#e94560" font-family="monospace" font-size="12">"pulse": float (1.0..1.2)</text>

  <!-- Gravity Loop -->
  <path d="M 650 520 Q 650 580 400 580 Q 150 580 150 480" stroke="#e94560" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowhead)" />
  <text x="400" y="570" text-anchor="middle" fill="#e94560" font-family="Arial, sans-serif" font-size="12" font-style="italic">Updates self.prev_features (The "Memory")</text>

  <!-- Legend -->
  <rect x="50" y="500" width="120" height="60" fill="rgba(0,0,0,0.3)" rx="5" />
  <text x="60" y="520" fill="#a2a8d3" font-family="Arial, sans-serif" font-size="10">[M] Matrix (2D)</text>
  <text x="60" y="535" fill="#a2a8d3" font-family="Arial, sans-serif" font-size="10">[A] Array (1D)</text>
  <text x="60" y="550" fill="#a2a8d3" font-family="Arial, sans-serif" font-size="10">[D] Dict / Object</text>

</svg>
