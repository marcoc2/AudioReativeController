# Me diz, chromatic flow (shaders/shadertoy/fluxo_cromatico_arc.glsl) alone over the clips:
# the last frame comes back pushed along the picture's own gradient, the colours splitting
# as they flow; the bass (against its last six seconds) sets how far they run, the kick
# lets the fresh picture back in, and every snare turns the flow to a new random angle.
# The strip at the bottom (source: meters) shows the drivers. Commands: see me_diz_acorde.yaml.
video:
  clip_per_bar: true
  bars_per_clip: 2
  clip_order: shuffle
  clip_end: loop
  layers:
    - source: clips
    - source: shadertoy
      file: shaders/shadertoy/fluxo_cromatico_arc.glsl
      uniforms:
        u_flow: &bass {relative: subbands.bass, window: 6, gain: 2.0}
        u_keep: 0.9
        u_kick: &kick {hits: {track: drums (midi), notes: [36]}, envelope: 0.25}
        u_turn: &turn {random_on: {track: drums (midi), notes: [38]}, ease: 0.2, gain: 6.283}
    - source: meters
      title: chromatic flow
      subtitle: bass -> flow · kick refreshes · snare turns it
      lanes:
        - {label: relative bass -> flow distance, knob: *bass}
        - {label: kick -> fresh picture, knob: *kick, range: [0, 1]}
        - {label: snare, roll: {track: drums (midi), notes: [38]}}
        - {label: random on the snare -> flow angle, knob: *turn, range: [0, 6.283]}
