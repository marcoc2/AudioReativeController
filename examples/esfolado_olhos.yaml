# Esfolado — "Olhos": uma parede de globos oculares em células de Voronoi (GPU).
# Todos olham para o mesmo ponto; cada CAIXA faz o olhar saltar (sacada), cada BUMBO
# dilata as pupilas, o lead faz todos piscarem; o acorde (SheetSage2) tinge as íris;
# o volume dilata as pupilas devagar. Cada olho também pisca por conta própria.
#
#   python clip_generator.py --file input/esfolado/esfolado_mix_20_09_2026.mp3 \
#       --midi input/esfolado/esfolado.mid --midi-offset 0.018 \
#       --scene examples/esfolado_olhos.yaml --start-time 13.351 --bars 9 \
#       --resolution 1280x720 --fps 30 --output render_output/esfolado_olhos_c6-14.mp4
video:
  layers:
    - source: eyes
      rows: 5
      seed: 3
      supersample: 2
      depth: 0.9
      hue: 0.55
      pupil_from: texture.loudness
      wander: 0.15
      harmony: {score: input/esfolado/sheetsage, snap: auto}
      hits:
        - {track: snare, gesture: saccade}
        - {track: kick, gesture: dilate, envelope: 0.25}
        - {track: [lead-legacy, synth-voice], gesture: blink, envelope: 0.22}
    - source: rgb_noise                  # pós-processamento: ruído RGB como o gegl:noise-rgb do GIMP
      bars: [[6, 14]]
      amount: 0.2
      correlated: true
      independent: true
      linear: true
      gaussian: true
      burst: 0.15
      trigger: {track: kick, envelope: 0.18}
