# Me diz, the chord's kaleidoscope (shaders/shadertoy/kifs_acorde_arc.glsl) alone, full
# frame: a 3D fractal of mirrored folds whose symmetry follows the harmony (E minor
# octahedral, G and B7 icosahedral); the root turns the twist between the folds, the third
# and the fifth paint its orbit traps; the kick opens it, the snare twists it, the camera
# goes an eighth of the way round each bar. The strip at the bottom (source: meters) shows
# the drivers. Commands: see me_diz_acorde.yaml.
video:
  clip_per_bar: true
  bars_per_clip: 2
  clip_order: shuffle
  clip_end: loop
  layers:
    - source: clips                 # the cut schedule (the fractal covers the picture)
    - source: shadertoy
      file: shaders/shadertoy/kifs_acorde_arc.glsl
      uniforms:
        u_mode: &mode {chord: &score {score: input/me_diz/sheetsage, snap: beat}, part: mode, glide: 0.4}
        u_root: &root {chord: *score, part: root, glide: 0.6}
        u_third: {chord: *score, part: tone, tone: 1}
        u_fifth: {chord: *score, part: tone, tone: 2}
        u_kick: &kick {hits: {track: drums (midi), notes: [36]}, envelope: 0.3}
        u_snare: &snare {hits: {track: drums (midi), notes: [38]}, envelope: 0.25}
        u_orbit: &orbit {bar: {step: 0.125, morph: 0.6}}
        u_glow: 0.5
    - source: meters
      title: chord kaleidoscope (KIFS)
      subtitle: mode -> symmetry · root -> twist · kick opens · snare twists
      lanes:
        - {label: chord, chords: *score}
        - {label: "chord mode -> symmetry (minor 0, major 1)", knob: *mode, range: [0, 1]}
        - {label: chord root -> twist, knob: *root}
        - {label: kick -> open, knob: *kick, range: [0, 1]}
        - {label: snare -> twist, knob: *snare, range: [0, 1]}
        - {label: bar -> camera orbit, knob: *orbit, range: window}
