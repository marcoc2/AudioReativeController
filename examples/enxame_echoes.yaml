# Ecos de vídeo dinâmicos (Doppler de tamanho + rotação de canais de cor) sobre o fractal de Julia.
# O post-op echoes mantém um histórico de frames anteriores e os sobrepõe com escala e hue shift dinâmicos.
video:
  layers:
    - source: julia
      resolution: 256      # grade retro interna
      iters: 48
      zoom_pulse:
        notes: [36]
        envelope: 0.3
      invert:
        audio: 'C:\Audio\recordings\projeto2024\ep\stems\enxame\enxame_ep_15_07_2026-005_snare.mp3'
        threshold: 0.3
        min_gap: 0.08
        envelope: 0.1
    - source: echoes
      depth: 6             # número de frames retidos na memória (RAM guardada)
      opacity_decay: 0.76  # decaimento de opacidade por passo de tempo
      scale_decay: 0.94    # Doppler (redução de tamanho por passo)
      hue_shift: 0.08      # rotação de cores acumulativa por passo
