# Me diz, a nebula (shaders/shadertoy/nebulosa_arc.glsl) alone, full frame: a volumetric
# fractal cloud flown through; the kick rushes the flight forward, the snare darkens the
# dust, the chord's mode shifts the cloud's form and its root colours it. The strip at
# the bottom (source: meters) shows the drivers. Commands: see me_diz_acorde.yaml.
video:
  clip_per_bar: true
  bars_per_clip: 2
  clip_order: shuffle
  clip_end: loop
  layers:
    - source: clips                 # the cut schedule (the cloud covers the picture)
    - source: shadertoy
      file: shaders/shadertoy/nebulosa_arc.glsl
      speed: 1.0
      rush: {hits: {track: drums (midi), notes: [36]}, amount: 6.0, envelope: 0.35}
      uniforms:
        u_form: &form {chord: &score {score: input/me_diz/sheetsage, snap: beat}, part: mode, glide: 0.8, gain: 0.06, bias: 0.5}
        u_hue: {harmony: *score, glide: 0.8}
        u_dark: &snare {hits: {track: drums (midi), notes: [38]}, envelope: 0.3, gain: 0.8, bias: 0.2}
        u_bright: 1.6
    - source: meters
      title: nebula
      subtitle: kick rushes · snare darkens · chord shapes and colours
      lanes:
        - {label: kick -> rush forward, knob: {hits: {track: drums (midi), notes: [36]}, envelope: 0.35}, range: [0, 1]}
        - {label: snare -> dark dust, knob: *snare, range: [0.2, 1]}
        - {label: chord mode -> form, knob: *form}
        - {label: chord -> colour, chords: *score}
