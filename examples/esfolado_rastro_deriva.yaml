# Esfolado — esfolado_rastro_longo.yaml with the wakes drifting away (shift:
# pixels/s at 720p), a new way on every clip: the copies stream off the characters like
# smoke. The biggest leaves its wake
# while the synth voice holds a note (hold: note); the second turns its wake on with the
# kick and keeps it to the end of that bar (hold: bar), tinted with the chord. Off, the wake
# fades over its length; a cut wipes it. Needs the mask track of the plain render:
#
#   python clip_generator.py --file input/esfolado/esfolado_mix_20_09_2026.mp3 \
#       --midi input/esfolado/esfolado.mid --midi-offset 0.018 \
#       --clips C:/Users/marco/Videos/ltx2/curadoria --clip-fit cover --seed 7 \
#       --start-time 13.351 --bars 8 --resolution 854x480 --fps 30 \
#       --scene examples/esfolado_rastro_deriva.yaml --masks render_output/esfolado_c6-13_s7_base_segments \
#       --output render_output/esfolado_rastro_deriva_c6-13_s7.mp4
video:
  clip_per_bar: true
  clip_order: random
  layers:
    - source: clips
    - source: cast
      roles:
        - {who: second, plays: {track: [kick, kick-2]}, act: wake, hold: bar, length: 4.8, every: 1/16, shift: 150, amount: 0.8,
           color: chord, harmony: {score: input/esfolado/sheetsage, snap: auto}}
        - {who: largest, plays: {track: synth-voice}, act: wake, hold: note, length: 8.0, every: 1/16, shift: 150, amount: 0.9}
