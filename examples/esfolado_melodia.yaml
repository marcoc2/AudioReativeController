# Esfolado — "the melody gets a body": the synth voice is the biggest object of each shot,
# leaving a trail of ghosts behind while its notes are held (long notes, long trails); the
# acid line is the second, sending a ring out of its outline on every note, each in the
# note's own hue (C, E and F land on three colours). Needs a mask track of the plain
# render (see examples/esfolado_world_melts.yaml for how it is made):
#
#   python clip_generator.py --file input/esfolado/esfolado_mix_20_09_2026.mp3 \
#       --midi input/esfolado/esfolado.mid --midi-offset 0.018 \
#       --clips C:/Users/marco/Videos/ltx2/curadoria --clip-fit cover --seed 3 \
#       --scene examples/esfolado_melodia.yaml --start-time 13.351 --bars 4 \
#       --resolution 854x480 --fps 30 --masks render_output/esfolado_gotas_follow_c6-9_base_segments \
#       --output render_output/esfolado_melodia_c6-9.mp4
video:
  clip_per_bar: true
  clip_order: random
  layers:
    - source: clips
    - source: cast
      roles:
        - {who: largest, plays: {track: synth-voice}, act: echo, trail: 3, every: 0.06, amount: 0.7}
        - {who: second, plays: {track: acid}, act: rings, speed: 260, life: 1.1, width: 4}
