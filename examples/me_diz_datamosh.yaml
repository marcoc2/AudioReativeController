# Me diz, datamosh on the cut (core/video/datamosh.py) alone over the clips: for a bar after
# each clip cut the old shot's pixels stay and are dragged by the new shot's camera move,
# in 16-pixel macroblocks, the new picture seeping in little by little; then the real
# picture comes back at once. The strip at the bottom (source: meters) marks the cuts in
# red and counts the seconds since the last one. Commands: see me_diz_acorde.yaml.
video:
  clip_per_bar: true
  bars_per_clip: 2
  clip_order: shuffle
  clip_end: loop
  layers:
    - source: clips
    - source: datamosh
      length: 1/1
      block: 16
      push: 2.0
      leak: 0.015
    - source: meters
      title: datamosh on the cut
      subtitle: a bar of the old shot dragged by the new one's motion
      lanes:
        - {label: drums, roll: {track: drums (midi), notes: [36, 38, 42, 46, 51]}}
        - {label: "seconds since the cut (the mosh lasts 2.29 s, a bar)", knob: {cut: since}, range: [0, 4.6]}
