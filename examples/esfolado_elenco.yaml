# Esfolado — the cast: characters in front, a world of clips and effects behind them.
#
# Foreground: the ketchup and mustard bottles sing the voice, Peppa cries and bursts, and
# Verity (the yellow ball, video4) wails, each shown exactly as its sound is cut in the
# REAPER project; plasticine dancers (input/esfolado/dancing) dance the reggaeton parts,
# and their stills pop up like stickers on the open hi-hat. Every figure is cut out by
# SAM2 on its own clip (render_output/footage/...).
# Background: excerpts of ten "final.mp4" clips (render_output/esfolado_fundo), a new one
# each bar, under an effect that changes with the song's form:
#
#    1-4   intro           feedback tunnel, the kick zooms it
#    5-8   reggaeton       pixel sort on the snare
#    9-12                  chromatic flow (bass flows it, snare turns it)
#   13-17                  flame lens (snare swirls, the acid bubbles, kick spins)
#   18-21  the FM5 lead    octagram tunnel coloured by the lead's notes
#   22-32  the sad middle  a blue nebula; the piano lights it; grain     (Verity, Peppa)
#   33-35  the riser       a dive into the Mandelbrot set, faster and faster
#   36     the clap        a white slap, the picture tears, Peppa bursts
#   36-39  reggaeton again kaleidoscope (each kick a ring)
#   40-43                  Escher spiral of the clips (a level a bar)
#   44-47                  datamosh at each cut
#   48-51  outro           a slow tunnel; one masked dancer; then black
#
#   python clip_generator.py --file input/esfolado/esfolado_mix_15_10_2026-full.mp3 \
#       --midi input/esfolado/esfolado_piano.mid --clips render_output/esfolado_fundo \
#       --clip-fit cover --seed 5 --scene examples/esfolado_elenco.yaml \
#       --bars 0 --resolution 480x854 --fps 30 --output render_output/esfolado_elenco.mp4
#
# esfolado_piano.mid is esfolado.mid plus the piano, taken from the REAPER project
# (core/reaper_project.write_midi). The chords come from the SheetSage run of the
# September mix (same harmony).
video:
  clip_per_bar: true
  clip_order: random
  triggers:
    snare_flip: {track: snare, actions: [reverse]}
  layers:
    - source: clips

    # ------------------------------------------------------------- background
    - source: feedback
      bars: [[1, 4]]
      decay: 0.86
      base_scale: 0.96
      max_scale: 1.08
      max_rotate: 0.06
      zoom_pulse: {track: kick, envelope: 0.25}
    - source: pixel_sort
      bars: [[5, 8]]
      amount: {hits: {track: snare}, envelope: 0.35, gain: 0.8}
      direction: [vertical, horizontal]
    - source: shadertoy
      bars: [[9, 12]]
      file: shaders/shadertoy/fluxo_cromatico_arc.glsl
      uniforms:
        u_flow: {relative: subbands.bass, window: 6, gain: 2.0}
        u_keep: 0.9
        u_kick: {hits: {track: kick}, envelope: 0.25}
        u_turn: {random_on: {track: snare}, ease: 0.2, gain: 6.283}
    - source: flame_lens
      bars: [[13, 17]]
      variations:
        swirl: {hits: {track: snare}, envelope: 0.5, amount: 1.0}
        bubble: {hits: {track: acid-tb-303, notes: [48, 52, 53]}, envelope: 0.4, amount: 0.8}
      turn: {rate: 1.5, base: 0.15, from: {hits: {track: kick}, envelope: 0.4}}
      zoom: 1.3
    - source: shadertoy
      bars: [[18, 21]]
      file: shaders/shadertoy/octagrams_arc.glsl
      uniforms:
        u_shape: {bar: {step: 1, morph: 0.35}}
        u_fly: {rate: 10.0, base: 4.0, from: {hits: {track: kick}, envelope: 0.3}}
        u_hue: {pitch: {track: "FM5 MIDI (patches 2, 5, 10, 11, 12, 14)"}, low: 70, high: 86, glide: 0.15}
        u_sat: 0.8
    - source: shadertoy
      bars: [[22, 32]]
      fade_in: 1
      file: shaders/shadertoy/nebulosa_arc.glsl
      speed: 0.6
      rush: {hits: {track: piano}, amount: 1.5, envelope: 0.6}
      uniforms:
        u_form: 0.53
        u_hue: {lfo: sine, period: 8/1, gain: 0.08, bias: 0.6}
        u_dark: 0.35
        u_bright: {adsr: {track: piano}, attack: 0.05, decay: 0.6, sustain: 0.5, release: 1.0, gain: 0.8, bias: 0.8}
    - source: deep_zoom
      bars: [[33, 35]]
      from: 88.0
      decades: 2.0
      depth: 13
      iterations: 2500
      hue: 0.62
      flow: {rate: 0.0, base: 0.4}
    - source: shadertoy
      bars: [[36, 39]]
      file: shaders/shadertoy/kaleidoscope_arc.glsl
      uniforms:
        u_ring0: {since: {track: kick}, nth: 0}
        u_ring1: {since: {track: kick}, nth: 1}
        u_ring2: {since: {track: kick}, nth: 2}
        u_hue: {harmony: {score: input/esfolado/sheetsage, snap: beat}, glide: 0.8}
    - source: shadertoy
      bars: [[40, 43]]
      file: shaders/shadertoy/droste_arc.glsl
      uniforms:
        u_phase: {bar: {step: 1, morph: 0.6}}
        u_kick: {hits: {track: kick}, envelope: 0.3}
    - source: datamosh
      bars: [[44, 47]]
      length: 1/1
      block: 16
      push: 2.0
      leak: 0.015
    - source: feedback
      bars: [[48, 54]]
      decay: 0.9
      base_scale: 0.98
      max_scale: 1.02
      max_rotate: 0.02
      hue_shift: 0.01

    # ------------------------------------------------------------- foreground
    # reggaeton: two dancers at the sides, bouncing on the kick
    - source: footage
      bars: [[5, 17], [36, 39]]
      file: input/esfolado/dancing/WanimateInterpolated_00063-audio.mp4      # the lion
      loop: true
      scale: 0.55
      x: 0.22
      y: {hits: {track: kick}, envelope: 0.2, gain: -0.025, bias: 0.72}
      cutout: {track: render_output/footage/dancing/WanimateInterpolated_00063-audio_segments, drop: [1], feather: 1}
    - source: footage
      bars: [[5, 17], [36, 39]]
      file: input/esfolado/dancing/WanimateInterpolated_00064-audio.mp4      # Cebolinha
      loop: true
      scale: 0.55
      x: 0.78
      y: {hits: {track: kick}, envelope: 0.2, gain: -0.025, bias: 0.72}
      cutout: {track: render_output/footage/dancing/WanimateInterpolated_00064-audio_segments, drop: [1], feather: 1}
    # the FM5 lead: the drawn boy rises with its notes, the creature answers mirrored
    - source: footage
      bars: [[18, 21], [40, 43]]
      file: input/esfolado/dancing/WanimateInterpolated_00068-audio.mp4      # the drawn boy
      loop: true
      scale: 0.7
      x: 0.3
      y: {pitch: {track: "FM5 MIDI (patches 2, 5, 10, 11, 12, 14)"}, low: 70, high: 86, glide: 0.1, gain: -0.25, bias: 0.75}
      cutout: {track: render_output/footage/dancing/WanimateInterpolated_00068-audio_segments, drop: [1], feather: 1}
    - source: footage
      bars: [[18, 21], [40, 43]]
      file: input/esfolado/dancing/WanimateInterpolated_00061-audio.mp4      # the creature
      loop: true
      flip: true
      scale: 0.6
      x: 0.72
      y: {hits: {track: snare}, envelope: 0.25, gain: -0.04, bias: 0.7}
      cutout: {track: render_output/footage/dancing/WanimateInterpolated_00061-audio_segments, drop: [1], feather: 1}
    # the masked pair, at the end of the second reggaeton, and one alone in the outro
    - source: footage
      bars: [[44, 51]]
      fade_out: 3
      file: input/esfolado/dancing/WanimateInterpolated_00069-audio.mp4
      loop: true
      scale: 0.6
      x: {lfo: sine, period: 4/1, gain: 0.1, bias: 0.25}
      y: 0.68
      cutout: {track: render_output/footage/dancing/WanimateInterpolated_00069-audio_segments, drop: [1], feather: 1}
    - source: footage
      bars: [[44, 47]]
      file: input/esfolado/dancing/WanimateInterpolated_00070-audio.mp4
      loop: true
      flip: true
      scale: 0.6
      x: {lfo: sine, period: 4/1, phase: 0.5, gain: 0.1, bias: 0.75}
      y: 0.68
      cutout: {track: render_output/footage/dancing/WanimateInterpolated_00070-audio_segments, drop: [1], feather: 1}
    # stickers: the stills pop on the open hi-hat, somewhere new each time
    - source: footage
      bars: [[5, 21], [36, 47]]
      file: input/esfolado/dancing/WanimateInterpolated_00057.png
      scale: {hits: {track: ez-hihat, notes: [46]}, envelope: 0.3, gain: 0.4}
      x: {random_on: {track: ez-hihat, notes: [46]}, seed: 1, gain: 0.7, bias: 0.15}
      y: {random_on: {track: ez-hihat, notes: [46]}, seed: 2, gain: 0.35, bias: 0.2}
      cutout: {track: render_output/footage/dancing/WanimateInterpolated_00057_segments, drop: [1], feather: 1}
    - source: footage
      bars: [[5, 21], [36, 47]]
      file: input/esfolado/dancing/WanimateInterpolated_00065.png
      scale: {hits: {track: snare}, envelope: 0.25, gain: 0.35}
      x: {random_on: {track: snare}, seed: 3, gain: 0.7, bias: 0.15}
      y: {random_on: {track: snare}, seed: 4, gain: 0.3, bias: 0.25}
      cutout: {track: render_output/footage/dancing/WanimateInterpolated_00065_segments, drop: [1], feather: 1}
    # the bottles sing the voice, swaying, a little bigger on each kick
    - source: footage
      file: input/esfolado/MiniMax_H3_00039_.mp4
      cues: {reaper: C:/Audio/recordings/nao_ser/reggaetoner/reggaetoner.rpp}
      scale: {hits: {track: kick}, envelope: 0.25, gain: 0.06, bias: 0.72}
      x: {lfo: sine, period: 2/1, gain: 0.16, bias: 0.42}
      y: 0.55
      cutout: {track: render_output/footage/MiniMax_H3_00039_segments, objects: [2, 3], feather: 2}
    # the sad middle: Verity wails, swelling with the piano
    - source: footage
      file: input/esfolado/video4.mp4
      cues: {reaper: C:/Audio/recordings/nao_ser/reggaetoner/reggaetoner.rpp}
      scale: {adsr: {track: piano}, attack: 0.1, decay: 0.8, sustain: 0.6, release: 1.2, gain: 0.15, bias: 0.75}
      x: {lfo: sine, period: 4/1, gain: 0.08, bias: 0.46}
      y: 0.5
      cutout: {track: render_output/footage/video4_segments, objects: [1, 4], feather: 3}
    - source: footage
      file: input/esfolado/LTX23_multiframe_00775_.mp4
      cues: {reaper: C:/Audio/recordings/nao_ser/reggaetoner/reggaetoner.rpp}
      scale: 1.2
      x: 0.55
      y: 0.6
      cutout: {track: render_output/footage/LTX23_multiframe_00775_segments, objects: [2, 3, 4], feather: 2}
    # the slap: Peppa's burst, the whole frame, the burst (clip 5.0 s) on the clap
    - source: footage
      file: input/esfolado/LTX23_multiframe_00775_.mp4
      cues: [[92.14, 4.02, 1.193, 0.822], [93.333, 5.0, 1.45]]
      fit: cover

    # ------------------------------------------------------------- over everything
    - source: rgb_split
      bars: [[5, 21], [36, 47]]
      amount: 10
      trigger: {track: snare, envelope: 0.15}
    - source: grain
      bars: [[22, 35]]
      amount: 0.07
      size: 1.4
      trigger: {track: piano, envelope: 0.4}
      burst: 0.05
    - source: rgb_split
      amount: 70
      trigger: {track: strong-clap, envelope: 0.9}
    - source: solid
      color: [255, 255, 255]
      triggers:
        slap: {track: strong-clap, envelope: 0.45}
    - source: solid
      color: [0, 0, 0]
      bars: [[52, 54]]
      fade_in: 2
