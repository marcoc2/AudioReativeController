# Esfolado — the cast: characters in front, a world of clips and effects behind them.
#
# Foreground: the ketchup and mustard bottles sing the voice, Peppa cries and bursts, and
# Verity (the yellow ball, video4) wails, each shown exactly as its sound is cut in the
# REAPER project; plasticine dancers (input/esfolado/dancing) dance the reggaeton parts,
# and their stills pop up like stickers on the open hi-hat. Every figure is cut out by
# SAM2 on its own clip (render_output/footage/...).
# Background: excerpts of ten "final.mp4" clips (render_output/esfolado_fundo), a new one
# each bar, under an effect that changes with the song's form:
#
#    1-4   intro           feedback tunnel, the kick zooms it
#    5-8   reggaeton       pixel sort on the snare
#    9-12                  chromatic flow (bass flows it, snare turns it)
#   13-17                  flame lens (snare swirls, the acid bubbles, kick spins)
#   18-21  the FM5 lead    octagram tunnel coloured by the lead's notes
#   22-32  the sad middle  a blue nebula; the piano lights it; grain     (Verity, Peppa)
#   33-35  the riser       a dive into the Mandelbrot set, faster and faster
#   36     the clap        a white slap, the picture tears, Peppa bursts
#   36-39  reggaeton again kaleidoscope (each kick a ring)
#   40-43                  Escher spiral of the clips (a level a bar)
#   44-47                  datamosh at each cut
#   48-51  outro           a slow tunnel; one masked dancer; then black
#
#   python clip_generator.py --file input/esfolado/esfolado_mix_15_10_2026-full.mp3 \
#       --midi input/esfolado/esfolado_reaper.mid --clips render_output/esfolado_fundo \
#       --clip-fit cover --seed 5 --scene examples/esfolado_elenco.yaml \
#       --bars 0 --resolution 480x854 --fps 30 --output render_output/esfolado_elenco.mp4
#
# The MIDI: esfolado_reaper.mid, every part taken from the REAPER project in its own time
# (tools/reaper_midi.py). REAPER starts bar 2 at 2.0 s (a meter marker there makes bar 1
# three beats long), so the file has a 3/4 bar 1; REAPER's own MIDI export (esfolado.mid)
# padded that bar and came one beat late. The audio needs no offset: its attacks fall on the notes.
# The chords come from the SheetSage run of the
# September mix (same harmony).
video:
  clip_per_bar: true
  clip_order: random
  triggers:
    snare_flip: {track: snare, actions: [reverse]}
  layers:
    - source: clips
      pins: {9: none}
    - source: group
      name: BG
      canvas: below
      layers:
        - source: shadertoy
          bars: [[18, 21]]
          file: shaders/shadertoy/octagrams_arc.glsl
          uniforms:
            u_shape:
              bar:
                step: 1
                morph: 0.35
            u_fly:
              rate: 10.0
              base: 4.0
              from:
                hits:
                  track: kick
                envelope: 0.3
            u_hue:
              pitch:
                track: FM5 MIDI (patches 2, 5, 10, 11, 12, 14)
              low: 70
              high: 86
              glide: 0.15
            u_sat: 0.8
        - source: shadertoy
          bars: [[22, 32]]
          fade_in: 1
          file: shaders/shadertoy/nebulosa_arc.glsl
          speed: 0.6
          rush:
            hits:
              track: piano
            amount: 1.5
            envelope: 0.6
          uniforms:
            u_form: 0.53
            u_hue:
              lfo: sine
              period: 8/1
              gain: 0.08
              bias: 0.6
            u_dark: 0.35
            u_bright:
              adsr:
                track: piano
              attack: 0.05
              decay: 0.6
              sustain: 0.5
              release: 1.0
              gain: 0.8
              bias: 0.8
        - source: deep_zoom
