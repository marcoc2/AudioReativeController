# Me diz, bubbles (shaders/shadertoy/bolhas_arc.glsl) alone, full frame: a foam of soap
# bubbles drifting past; the kick swells them, each organ chord lights them (an adsr on
# the organ) in its latest note's colour, the chord tints the light. The strip at
# the bottom (source: meters) shows the organ and the drivers. Commands: see
# me_diz_acorde.yaml.
video:
  clip_per_bar: true
  bars_per_clip: 2
  clip_order: shuffle
  clip_end: loop
  layers:
    - source: clips                 # the cut schedule (the foam covers the picture)
    - source: shadertoy
      file: shaders/shadertoy/bolhas_arc.glsl
      uniforms:
        u_s: &kick {hits: {track: drums (midi), notes: [36]}, envelope: 0.4, gain: 0.18, bias: 1.06}
        u_note: {pitch: &organ {track: organ}, low: 0, high: 127, glide: 0, gain: 127}
        u_light: &light {adsr: *organ, attack: 0.03, decay: 0.3, sustain: 0.6, release: 0.5}
        u_hue: {harmony: &score {score: input/me_diz/sheetsage, snap: beat}, glide: 0.8}
        u_travel: {rate: 0.0, base: 0.25}
    - source: meters
      title: bubbles
      subtitle: kick swells · organ chords light them · chord tints
      lanes:
        - {label: kick -> swell, knob: *kick, range: [1.06, 1.24]}
        - {label: organ, roll: *organ}
        - {label: organ adsr -> light, knob: *light, range: [0, 1]}
        - {label: chord -> tint, chords: *score}
