# Kiss — "Chama": um fractal flame (algoritmo de Scott Draves) girado pela música.
# GPU (compute shader via moderngl); sem contexto 4.3 cai para a CPU, mais granulado.
#
#   python clip_generator.py --file input/scott/kiss.mp3 \
#       --midi input/scott/Instrumento.mid --midi-offset 0.059 \
#       --scene examples/kiss_chama.yaml --bars 0 --resolution 1280x720 --fps 48 \
#       --output render_output/kiss_chama.mp4
#
# O volume dá a luz e a velocidade com que as transformações giram; o crescendo abre o
# zoom; quando o timbre se move a figura vagueia. A harmonia (A#min <-> G#sus4) muda a
# paleta e a pose da figura. A bateria usa os mesmos gestos instantâneos da cena "Areia":
# 36 incha, 40 faísca dourado, 48 torce para um lado e para o outro, 37/39 onda de choque.
video:
  layers:
    - source: flame
      genome: {random: 5}
      samples: 8                # milhões de pontos por frame
      supersample: 2
      spin: 0.02
      pose: 0.25
      root: 10                  # A#min até a primeira troca de acorde
      harmony:
        score: input/scott/sheetsage
        snap: auto
        bloom: 1.5
      hits:
        - {notes: [36], gesture: punch, envelope: 0.10}
        - {notes: [40], gesture: sizzle, envelope: 0.09}
        - {notes: [48], gesture: twist, envelope: 0.10}
        - {notes: [37, 39], gesture: ring}
