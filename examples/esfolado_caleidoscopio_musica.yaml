# Esfolado — "Caleidoscópio da música": o túnel de cristal do kasari39 (shadertoy ttKGDt) na
# cópia shaders/shadertoy/kaleidoscope_arc.glsl, nos compassos 20–27 (o único trecho com kick
# e harmonia andando ao mesmo tempo: KICK-2 e Fá# → Fá → Sol# → Ré# → Fá):
#   cada KICK-2 solta um anel de luz da câmera túnel adentro (os três mais recentes ao mesmo tempo)
#   a HARMONIA (SheetSage2) pinta o cristal com a cor da fundamental do acorde; os anéis saem na
#       mesma cor, mais quentes
#
#   python clip_generator.py --file input/esfolado/esfolado_mix_20_09_2026.mp3 \
#       --midi input/esfolado/esfolado.mid --midi-offset 0.018 \
#       --scene examples/esfolado_caleidoscopio_musica.yaml --start-time 53.351 --bars 8 \
#       --resolution 1280x720 --fps 30 --output render_output/esfolado_caleidoscopio_musica_c20-27.mp4
video:
  layers:
    - source: shadertoy
      file: shaders/shadertoy/kaleidoscope_arc.glsl
      uniforms:
        u_ring0: {since: {track: kick-2}, nth: 0}
        u_ring1: {since: {track: kick-2}, nth: 1}
        u_ring2: {since: {track: kick-2}, nth: 2}
        u_hue: {harmony: {score: input/esfolado/sheetsage, snap: auto}, glide: 0.8}
        u_sat: 0.7
        u_paint: 0.65
