# Esfolado — "Onda": o luto (compassos 22–35) refeito com os quadrinhos da curadoria.
# O desenho é virado do avesso (o traço preto vira linha branca sobre fundo escuro, como a
# areia do Chladni) e cada nota do PIANO manda uma onda de choque do centro que dobra a
# imagem e tinge só as linhas; os acordes soltam ondas sobrepostas. Cada KICK-2 incha e
# acende a imagem. O acorde (SheetSage2) escolhe a cor da onda. Um clipe por compasso.
#
#   python clip_generator.py --file input/esfolado/esfolado_mix_20_09_2026.mp3 \
#       --midi input/esfolado/esfolado.mid --midi-offset 0.018 \
#       --clips C:/Users/marco/Videos/ltx2/curadoria --clip-fit cover --seed 3 \
#       --scene examples/esfolado_onda_curadoria.yaml --start-time 56.018 --bars 14 \
#       --resolution 1280x720 --fps 30 --output render_output/esfolado_onda_curadoria_c22-35.mp4
video:
  clip_per_bar: true
  clip_order: random
  layers:
    - source: clips
    - source: shockwave
      invert: true
      fill: 0.3
      rings: {track: 7}                  # o piano (a trilha 7; há duas chamadas "piano")
      push: 0.14                         # empurra bem mais que a areia (0.06)
      width: 0.17                        # anel mais largo
      life: 0.8                          # e mais demorado
      glow: 1.8                          # acende forte as linhas e dá um clarão no fundo
      split: 1.0                         # rasga vermelho e azul por onde passa
      swell: 0.10                        # o kick-2 incha o dobro
      scatter: 1.0                       # areia: a onda espalha a imagem em grãos, como o Chladni
      punch: {track: kick-2, envelope: 0.30}
      harmony: {score: input/esfolado/sheetsage, snap: auto}
