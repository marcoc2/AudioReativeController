# Me diz, the chord's Nova fractal (shaders/shadertoy/newton_acorde_arc.glsl, u_nova): as
# me_diz_newton (the roots are the chord's notes, the clip shows through the basins), with
# the Nova term on, whose constant is the organ's lowest sounding note (u_bass), so every
# bass move reshapes the basins' frills; the kick relaxes the iteration, the snare spins
# it. Alone, full frame. The strip at the bottom (source: meters) shows the drivers.
# Commands: see me_diz_acorde.yaml.
video:
  clip_per_bar: true
  bars_per_clip: 2
  clip_order: shuffle
  clip_end: loop
  layers:
    - source: clips
    - source: shadertoy
      file: shaders/shadertoy/newton_acorde_arc.glsl
      channel0: frame
      uniforms:
        u_t0: {chord: &score {score: input/me_diz/sheetsage, snap: beat}, part: tone, tone: 0, glide: 0.5}
        u_t1: {chord: *score, part: tone, tone: 1, glide: 0.5}
        u_t2: {chord: *score, part: tone, tone: 2, glide: 0.5}
        u_t3: {chord: *score, part: tone, tone: 3, glide: 0.5}
        u_size: {chord: *score, part: size}
        u_relax: 1.0
        u_kick: &kick {hits: {track: drums (midi), notes: [36]}, envelope: 0.3}
        u_spin: {rate: 1.2, base: 0.05, from: &snare {hits: {track: drums (midi), notes: [38]}, envelope: 0.4}}
        u_zoom: 1.0
        u_video: 0.55
        u_nova: 0.8
        u_bass: &bass {voice: {track: organ}, k: 0, part: pitch}
    - source: meters
      title: chord Nova fractal
      subtitle: chord notes = roots · organ's lowest note -> Nova constant
      lanes:
        - {label: chord, chords: *score}
        - {label: organ, roll: {track: organ}}
        - {label: organ's lowest note -> Nova constant, knob: *bass}
        - {label: kick -> relax, knob: *kick, range: [0, 1]}
        - {label: snare -> spin burst, knob: *snare, range: [0, 1]}
